name: AI PR Review (Groq)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]

jobs:
  review:
    name: AI Code Review with Groq
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          echo "Diff size: $(wc -c < pr_diff.txt) bytes"

      - name: Review with Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DIFF=$(head -c 30000 pr_diff.txt)

          PAYLOAD=$(jq -n \
            --arg diff "$DIFF" \
            '{
              model: "llama-3.3-70b-versatile",
              messages: [
                {
                  role: "system",
                  content: "Eres un revisor senior de React y TypeScript. El proyecto usa Vite, Yarn moderno y Cloudflare Pages. Enfócate en: props faltantes o tipados incorrectos, efectos con dependencias incorrectas, fugas de memoria, mal uso de variables de entorno VITE_*, problemas de rendimiento. Ignora estilos de formato. Si no hay problemas reales, responde solo: Sin problemas encontrados. Responde en español usando Markdown."
                },
                {
                  role: "user",
                  content: ("Revisa este diff de un Pull Request:\n\n```diff\n" + $diff + "\n```")
                }
              ],
              temperature: 0.3,
              max_tokens: 4096
            }')

          RESPONSE=$(curl -sS -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$REVIEW" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error.message // "Error desconocido"')
            echo "⚠️ Groq API error: $ERROR"
            echo "⚠️ No se pudo obtener la revisión del modelo." > review_output.md
          else
            echo "$REVIEW" > review_output.md
          fi

      - name: Post review on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s review_output.md ]; then
            {
              echo "## 🤖 AI Code Review (Groq)"
              echo ""
              cat review_output.md
              echo ""
              echo "---"
              echo "*Revisión automática por Groq AI*"
            } > comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
